services:
  # WebSocket relay server
  - type: web
    name: townsquare-ws
    env: node
    region: oregon
    plan: starter
    buildCommand: npm install
    startCommand: node server/index.js
    envVars:
      - key: NODE_ENV
        value: production

  # Static frontend
  - type: web
    name: townsquare
    env: static
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VUE_APP_SOCKET_URL
        value: wss://townsquare-ws.onrender.com/
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
